name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: Compute version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          sha="${GITHUB_SHA::7}"
          is_release=false
          prerelease=false
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            re='^v([0-9]+)\.([0-9]+)\.([0-9]+)(-(alpha|beta|rc)\.[0-9]+)?$'
            if [[ ! "$tag" =~ $re ]]; then
              echo "::error::Tag '$tag' must look like v1.2.3, v1.2.3-rc.1, v1.2.3-beta.1 or v1.2.3-alpha.1"
              exit 1
            fi
            is_release=true
            major="${BASH_REMATCH[1]}"; minor="${BASH_REMATCH[2]}"; patch="${BASH_REMATCH[3]}"
            [[ -n "${BASH_REMATCH[4]}" ]] && prerelease=true
            base="${major}.${minor}.${patch}"
            plain="${tag#v}"
            name="${plain}+${sha}"
            code=$(( major * 10000 + minor * 100 + patch ))
            # The changelog must describe this release (exact version, or the x.y.z it belongs to).
            heading=""
            for h in "$plain" "$base"; do
              if grep -qE "^## \[${h//./\\.}\]" CHANGELOG.md; then heading="$h"; break; fi
            done
            if [[ -z "$heading" ]]; then
              echo "::error::CHANGELOG.md has no '## [$plain]' or '## [$base]' section"
              exit 1
            fi
            echo "changelog_heading=$heading" >> "$GITHUB_OUTPUT"
          else
            base=$(grep -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | head -n1 | tr -d '#[ ' || true)
            base="${base:-0.0.0}"
            name="${base}-dev+${sha}"
            code="${GITHUB_RUN_NUMBER}"
          fi
          echo "is_release=$is_release" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "file_name=${name//+/-}" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Version name: $name, version code: $code"

      - name: Test and lint
        run: make check RUN=

      - name: Release lint and shrinking
        run: make check-release RUN=

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::Secret SIGNING_KEYSTORE_BASE64 is not set (see README, Releases)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK and AAB
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ steps.version.outputs.name }}
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: make release RUN=

      - name: Collect artifacts
        env:
          FILE_NAME: ${{ steps.version.outputs.file_name }}
          APP_SLUG: ${{ github.event.repository.name }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/${APP_SLUG}-${FILE_NAME}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/${APP_SLUG}-${FILE_NAME}.aab"
          cp app/build/outputs/mapping/release/mapping.txt "dist/${APP_SLUG}-${FILE_NAME}-mapping.txt"
          rm -f "$RUNNER_TEMP/release.jks"
          # Checksums of every file above, published as an asset so downloads can be verified (README, Download).
          (cd dist && sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS")
          mv "$RUNNER_TEMP/SHA256SUMS" dist/SHA256SUMS
          cat dist/SHA256SUMS
          # Fail the build if the checksum file does not verify what it describes.
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Signing certificate digest
        id: cert
        env:
          FILE_NAME: ${{ steps.version.outputs.file_name }}
          APP_SLUG: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          apksigner=$(find "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}/build-tools" -name apksigner -type f | sort -V | tail -n1)
          if [[ -z "$apksigner" ]]; then
            echo "::error::apksigner not found in the Android SDK build-tools"
            exit 1
          fi
          apk="dist/${APP_SLUG}-${FILE_NAME}.apk"
          "$apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/certs.txt"
          digest=$(grep -m1 'certificate SHA-256 digest' "$RUNNER_TEMP/certs.txt" | awk '{print $NF}')
          if [[ -z "$digest" ]]; then
            echo "::error::Could not read the signing certificate digest"
            exit 1
          fi
          echo "Signing certificate SHA-256: $digest"
          {
            echo
            echo "## Verify the download"
            echo
            echo "Signing certificate SHA-256 digest:"
            echo
            echo "\`$digest\`"
            echo
            echo "Check the files against \`SHA256SUMS\` and compare this digest with the output of"
            echo "\`apksigner verify --print-certs <file>.apk\` (see the README, Download and verify)."
          } > "$RUNNER_TEMP/verify-notes.md"

      - name: Extract release notes
        if: steps.version.outputs.is_release == 'true'
        env:
          HEADING: ${{ steps.version.outputs.changelog_heading }}
        run: |
          awk -v h="## [${HEADING}]" '
            index($0, h) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::The CHANGELOG section for $HEADING is empty"
            exit 1
          fi
          cat "$RUNNER_TEMP/verify-notes.md" >> release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ steps.version.outputs.file_name }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: steps.version.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          files: dist/*
